[build]
  command = "node build.js"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# Proxys du site : le navigateur télécharge les livres Gutenberg via ce domaine,
# ce qui contourne les blocages CORS sans dépendre de proxys publics.
[[redirects]]
  from = "/proxy/gutenberg/*"
  to = "https://www.gutenberg.org/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/proxy/gutendex/*"
  to = "https://gutendex.com/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/proxy/googlebooks/*"
  to = "https://books.google.com/:splat"
  status = 200
  force = true

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "no-cache"
